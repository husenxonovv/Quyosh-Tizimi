<style>
:root{--ink:#eef2ff;--acc:#ffb43a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:inherit;margin:0}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
main{position:relative;z-index:1;pointer-events:none}
section{min-height:100vh;display:flex;align-items:center;padding:6vh clamp(1.25rem,7vw,6rem);scroll-snap-align:center}
.t{max-width:28rem}
h1,h2{font-family:Syne,"Instrument Sans",sans-serif;font-weight:800;line-height:1;letter-spacing:-.035em;margin-bottom:1.1rem}

.last{justify-content:center;align-items:flex-start;text-align:center}
.last .t{max-width:30rem}.last p{margin:0 auto}
.rail{position:fixed;right:clamp(.7rem,2vw,1.5rem);top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;gap:.7rem}
.rail button{width:.7rem;height:.7rem;border-radius:50%;border:1.5px solid #ffffff99;background:transparent;cursor:pointer;padding:0;transition:all .3s}
.rail button.on{background:var(--acc);border-color:var(--acc);transform:scale(1.5)}
.rail button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.by{position:fixed;left:clamp(1rem,3vw,2rem);bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:2;font-size:.85rem;opacity:.85;pointer-events:none}
.by b{color:var(--acc);font-weight:500}
.fail{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:2rem;z-index:3}
@media(max-width:700px){section{align-items:flex-end;padding-bottom:9vh}.last{align-items:flex-start;padding-top:12vh}main::before{content:"";position:fixed;inset:auto 0 0 0;height:48vh;background:linear-gradient(transparent,#02030acc 55%);z-index:-1}.by{display:none}}
</style>
</head>

function h(x,y,z){var s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return s-Math.floor(s)}

 return L(L(L(h(xi,yi,zi),h(xi+1,yi,zi),xf),L(h(xi,yi+1,zi),h(xi+1,yi+1,zi),xf),yf),L(L(h(xi,yi,zi+1),h(xi+1,yi,zi+1),xf),L(h(xi,yi+1,zi+1),h(xi+1,yi+1,zi+1),xf),yf),zf)}

function tex(k){var W=512,H=256,cv=document.createElement('canvas');cv.width=W;cv.height=H;var g=cv.getContext('2d'),im=g.createImageData(W,H),f=k==='mer'?7:k==='jup'||k==='sat'?3:4;

  var rc=document.createElement('canvas');rc.width=512;rc.height=4;var rx=rc.getContext('2d');for(var X=0;X<512;X++){var t=X/512,al=.3+.6*Math.abs(Math.sin(t*70)*Math.sin(t*23+1));if(t<.04||t>.97)al=0;if(t>.6&&t<.65)al=.04;rx.fillStyle='rgba(226,206,160,'+al+')';rx.fillRect(X,0,1,4)}
  var r=new THREE.Mesh(rg,new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(rc),transparent:true,side:THREE.DoubleSide,roughness:1}));r.rotation.x=Math.PI/2;tg.add(r)}
 if(!i){[[26,.55],[48,.22]].forEach(function(z){var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:0xff9a30,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:z[1]*1.6}));sp.scale.set(z[0],z[0],1);g.add(sp)})}});
// yulduzlar
var SN=5000,sp=new Float32Array(SN*3),sc=new Float32Array(SN*3),tc=[[1,1,1],[.7,.8,1],[1,.9,.7]],cc=new THREE.Color();
for(var i=0;i<SN;i++){var th=Math.random()*6.2832,ph=Math.acos(2*Math.random()-1),R=400+Math.random()*500;sp[i*3]=47+R*Math.sin(ph)*Math.cos(th);sp[i*3+1]=R*Math.cos(ph);sp[i*3+2]=R*Math.sin(ph)*Math.sin(th);var t=tc[i%3],b=.4+Math.random()*.6;sc[i*3]=t[0]*b;sc[i*3+1]=t[1]*b;sc[i*3+2]=t[2]*b}

var cp=new V(0,0,30),ct=new V(0,0,0),pa1=new V(),pa2=new V(),ta1=new V(),ta2=new V(),dp=new V(),dt=new V(),last=performance.now(),curI=-1;
function sm(x){return x*x*(3-2*x)}

 var f=Math.max(0,Math.min(NS-1,scrollY/innerHeight)),i=Math.min(NS-2,Math.floor(f)),t=sm(f-i);if(f>=NS-1){i=NS-2;t=1}
 pose(i,pa1,ta1);pose(i+1,pa2,ta2);dp.lerpVectors(pa1,pa2,t);dt.lerpVectors(ta1,ta2,t);dp.x+=mxp*1.2;dp.y-=myp*.8;

 var near=Math.round(f);if(near!==curI){curI=near;document.documentElement.style.setProperty('--acc',D[near].c);dots.forEach(function(d,j){d.classList.toggle('on',j===near)})}
